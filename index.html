<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Farm Management Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f9f9f9; color:#333; }
    header { background:#2e7d32; color:#fff; padding:14px; text-align:center; font-size:20px; font-weight:bold; }

    nav { display:flex; flex-wrap:wrap; background:#fff; border-bottom:1px solid #ccc; }
    nav button {
      flex:1; margin:6px; padding:8px; border:none;
      background:#e8f5e9; cursor:pointer; border-radius:4px;
    }
    nav button.active-btn { background:#2e7d32; color:#fff; font-weight:bold; }

    .tab { display:none; padding:12px; }
    .tab.active { display:block; }

    .summary {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
      gap:10px; margin-bottom:20px;
    }

    .card {
      background:#fff; padding:12px; border-radius:6px;
      box-shadow:0 1px 3px rgba(0,0,0,.1);
      text-align:center;
    }

    table { width:100%; border-collapse:collapse; background:#fff; }
    th,td { border:1px solid #ccc; padding:6px; font-size:14px; }
    th { background:#eee; }
    .table-wrapper { overflow-x:auto; }

    .row-missed{background:#f8d7da;}
    .row-today{background:#fff3cd;}
    .row-upcoming{background:#e7f3ff;}
    .row-done{background:#d4edda;}
    .row-skipped{background:#eee;}

    .summary-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:12px; margin-bottom:20px;
    }
  </style>
</head>

<body>

<header>🌱 Farm Management Dashboard</header>

<nav>
  <button onclick="showTab('dashboard',event)" class="active-btn">Dashboard</button>
  <button onclick="showTab('tasks',event)">Tasks</button>
  <button onclick="showTab('expenses',event)">Expenses</button>
  <button onclick="showTab('analysis',event)">Analytics</button>
  <button onclick="showTab('compost',event)">Compost SOP</button>
</nav>

<!-- DASHBOARD -->
<div id="dashboard" class="tab active">
  <div class="summary">
    <div class="card"><strong>Total Plots</strong><div id="sumPlots">0</div></div>
    <div class="card"><strong>Total Plants</strong><div id="sumPlants">0</div></div>
    <div class="card"><strong>Total Expense</strong><div id="sumExpense">₹0</div></div>
    <div class="card"><strong>Missed Tasks</strong><div id="sumMissed">0</div></div>
  </div>
  <canvas id="dashboardChart"></canvas>
</div>

<!-- TASKS -->
<div id="tasks" class="tab">
  <h3>Task Schedule</h3>
  <div class="table-wrapper">
    <table id="taskTable"></table>
  </div>
</div>

<!-- EXPENSES -->
<div id="expenses" class="tab">
  <h3>Expense Summary</h3>

  <div class="summary-grid">
    <div class="card"><strong>Total Expense</strong><div id="expTotal"></div></div>
    <div class="card"><strong>Month-wise</strong><div id="expMonth"></div></div>
    <div class="card"><strong>Year-wise</strong><div id="expYear"></div></div>
    <div class="card"><strong>Plot-wise</strong><div id="expPlot"></div></div>
    <div class="card"><strong>Crop-wise</strong><div id="expCrop"></div></div>
  </div>

  <h3>Expense Ledger</h3>
  <div class="table-wrapper">
    <table id="expenseTable"></table>
  </div>
</div>

<!-- ANALYTICS -->
<div id="analysis" class="tab">
  <h3>Expense Analytics</h3>
  <canvas id="expenseMonthChart"></canvas>
  <canvas id="expensePlotChart"></canvas>
  <canvas id="expenseCropChart"></canvas>
</div>

<div id="compost" class="tab">
  <h3>🌱 Compost & Vermicompost SOP (Kannada)</h3>

  <div style="
    background:#fff;
    border:1px solid #ccc;
    border-radius:6px;
    overflow:hidden;
    height:80vh;
  ">
    <iframe
            src="compost_kannada.html"
            style="width:100%; height:100%; border:none;"
            title="Compost SOP Kannada">
    </iframe>
  </div>
</div>

<script>
  /* ---------- TAB ---------- */
  function showTab(id,e){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active-btn'));
    e.target.classList.add('active-btn');
  }

  /* ---------- HELPERS ---------- */
  function parseDate(v){
    if(v instanceof Date) return v;
    if(typeof v==="number"){
      const d=XLSX.SSF.parse_date_code(v);
      return new Date(d.y,d.m-1,d.d);
    }
    if(typeof v==="string" && /^\d{2}\/\d{2}\/\d{4}$/.test(v)){
      const [dd,mm,yy]=v.split("/");
      return new Date(yy,mm-1,dd);
    }
    return new Date(v);
  }
  function fmt(d){ return d.toLocaleDateString("en-GB"); }
  function amt(v){ return Number(String(v).replace(/[₹,]/g,""))||0; }

  /* ---------- TASK STATE ---------- */
  function taskState(d,status){
    const today=new Date(); today.setHours(0,0,0,0);
    d.setHours(0,0,0,0);
    if(status==="Done") return "DONE";
    if(status==="Skipped") return "SKIPPED";
    if(d<today) return "MISSED";
    if(d.getTime()===today.getTime()) return "DUE TODAY";
    return "UPCOMING";
  }

  /* ---------- LOAD XLS ---------- */
  fetch("farm_data.xlsx")
          .then(r=>r.arrayBuffer())
          .then(data=>{
            const wb=XLSX.read(data,{type:"array"});
            const plots=XLSX.utils.sheet_to_json(wb.Sheets["Plots"]);
            const crops=XLSX.utils.sheet_to_json(wb.Sheets["crops"]);
            const tasks=XLSX.utils.sheet_to_json(wb.Sheets["task_schedule"]);
            const expenses=XLSX.utils.sheet_to_json(wb.Sheets["expenses"]);

            renderDashboard(plots,crops,tasks,expenses);
            renderTasks(tasks);
            renderExpenseSummary(plots,crops,expenses);
            renderExpenseTable(expenses);
            renderExpenseCharts(plots,crops,expenses);
          });

  /* ---------- DASHBOARD ---------- */
  function renderDashboard(plots,crops,tasks,expenses){
    sumPlots.textContent=plots.length;
    sumPlants.textContent=crops.reduce((s,c)=>s+(c.Count||0),0);

    const total=expenses.reduce((s,e)=>s+amt(e.amount),0);
    sumExpense.textContent="₹"+total.toLocaleString();

    const missed=tasks.filter(t=>taskState(parseDate(t.date),t.status)==="MISSED").length;
    sumMissed.textContent=missed;

    new Chart(dashboardChart,{
      type:"bar",
      data:{labels:["Total Expense","Missed Tasks"],
        datasets:[{data:[total,missed],backgroundColor:["#4caf50","#e53935"]}]}
    });
  }

  /* ---------- TASKS ---------- */
  function renderTasks(tasks){
    const t=taskTable;
    t.innerHTML="<tr><th>Date</th><th>Plot</th><th>Crop</th><th>Goal</th><th>Task</th><th>Status</th></tr>";
    tasks.forEach(x=>{
      const s=taskState(parseDate(x.date),x.status);
      const r=t.insertRow();
      r.className={
        MISSED:"row-missed",
        "DUE TODAY":"row-today",
        UPCOMING:"row-upcoming",
        DONE:"row-done",
        SKIPPED:"row-skipped"
      }[s];
      [fmt(parseDate(x.date)),x.plot,x.crop,x.Goal,x.task,s]
              .forEach(v=>r.insertCell().textContent=v||"");
    });
  }

  /* ---------- EXPENSE SUMMARY ---------- */
  function renderExpenseSummary(plots,crops,expenses){
    const plotIds=plots.map(p=>p.plot_id);
    const cropNames=[...new Set(crops.map(c=>c.Crop))];

    let total=0,byMonth={},byYear={},byPlot={},byCrop={};

    expenses.forEach(e=>{
      const a=amt(e.amount); total+=a;
      const d=parseDate(e.date);
      const m=`${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
      byMonth[m]=(byMonth[m]||0)+a;
      byYear[d.getFullYear()]=(byYear[d.getFullYear()]||0)+a;

      const pList=e.plot==="All"?plotIds:[e.plot];
      const cList=e.crop==="All"?cropNames:[e.crop];
      const split=a/(pList.length*cList.length);

      pList.forEach(p=>byPlot[p]=(byPlot[p]||0)+split*cList.length);
      cList.forEach(c=>byCrop[c]=(byCrop[c]||0)+split*pList.length);
    });

    expTotal.innerText="₹"+total.toLocaleString();
    expMonth.innerHTML=Object.entries(byMonth).map(([k,v])=>`${k}: ₹${v.toLocaleString()}`).join("<br>");
    expYear.innerHTML=Object.entries(byYear).map(([k,v])=>`${k}: ₹${v.toLocaleString()}`).join("<br>");
    expPlot.innerHTML=Object.entries(byPlot).map(([k,v])=>`${k}: ₹${v.toLocaleString()}`).join("<br>");
    expCrop.innerHTML=Object.entries(byCrop).map(([k,v])=>`${k}: ₹${v.toLocaleString()}`).join("<br>");
  }

  /* ---------- EXPENSE LEDGER ---------- */
  function renderExpenseTable(expenses){
    const t=expenseTable;
    t.innerHTML="<tr><th>Date</th><th>Plot</th><th>Crop</th><th>Type</th><th>Description</th><th>Amount</th></tr>";
    expenses.forEach(e=>{
      t.insertRow().innerHTML=
              `<td>${fmt(parseDate(e.date))}</td><td>${e.plot}</td><td>${e.crop}</td><td>${e.expense_type}</td><td>${e.description}</td><td>${e.amount}</td>`;
    });
  }

  /* ---------- EXPENSE CHARTS ---------- */
  function renderExpenseCharts(plots,crops,expenses){
    const plotIds=plots.map(p=>p.plot_id);
    const cropNames=[...new Set(crops.map(c=>c.Crop))];
    const byMonth={},byPlot={},byCrop={};

    expenses.forEach(e=>{
      const a=amt(e.amount);
      const d=parseDate(e.date);
      const m=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;

      byMonth[m]=(byMonth[m]||0)+a;

      const pList=e.plot==="All"?plotIds:[e.plot];
      const cList=e.crop==="All"?cropNames:[e.crop];
      const split=a/(pList.length*cList.length);

      pList.forEach(p=>byPlot[p]=(byPlot[p]||0)+split*cList.length);
      cList.forEach(c=>byCrop[c]=(byCrop[c]||0)+split*pList.length);
    });

    new Chart(expenseMonthChart,{type:"bar",data:{labels:Object.keys(byMonth),datasets:[{data:Object.values(byMonth)}]}});
    new Chart(expensePlotChart,{type:"bar",data:{labels:Object.keys(byPlot),datasets:[{data:Object.values(byPlot)}]}});
    new Chart(expenseCropChart,{type:"bar",data:{labels:Object.keys(byCrop),datasets:[{data:Object.values(byCrop)}]}});
  }
</script>
</body>
</html>
