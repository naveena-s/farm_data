<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monthly Organic Farm Checklist – 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        body{
            font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
            background:#f5f7f6;color:#1f2937;line-height:1.6;padding:24px
        }
        h1,h2{color:#1b5e20;margin-top:0}

        .month{
            background:#fff;border-radius:12px;padding:22px;margin-bottom:26px;
            box-shadow:0 4px 14px rgba(0,0,0,.08)
        }

        table{width:100%;border-collapse:collapse;margin-top:12px}
        th,td{
            padding:12px 14px;border-bottom:1px solid #e5e7eb;
            vertical-align:top
        }
        th{background:#e8f5e9;font-weight:600;text-align:left}

        .tag{
            display:inline-block;padding:4px 10px;border-radius:20px;
            font-size:.75em;font-weight:600;margin-right:6px
        }
        .areca{background:#c8e6c9}
        .coconut{background:#ffe0b2}
        .banana{background:#fff9c4}

        .note{
            background:#e3f2fd;border-left:6px solid #1976d2;
            padding:12px 16px;margin-top:14px;font-weight:600
        }
    </style>
</head>

<body>

<h1>📅 Monthly Organic Farm Checklist – 2026</h1>

<p>
    Crops covered:
    <span class="tag banana">Banana</span>
    <span class="tag areca">Arecanut</span>
    <span class="tag coconut">Coconut</span>
</p>

<div id="checklistContainer"></div>

<script>
    fetch("farm_data.xlsx")
        .then(r=>r.arrayBuffer())
        .then(data=>{
            const wb = XLSX.read(data,{type:"array"});
            const rows = XLSX.utils.sheet_to_json(wb.Sheets["checklist"]);

            renderChecklist(rows);
        });

    function renderChecklist(rows){
        const container = document.getElementById("checklistContainer");

        rows.forEach(r=>{
            const monthDiv = document.createElement("div");
            monthDiv.className = "month";

            monthDiv.innerHTML = `
      <h2>${r.Month}</h2>
      <table>
        <tr><th>Crop</th><th>Tasks</th></tr>

        ${rowHTML("Banana", r.Banana)}
        ${rowHTML("Areca", r.Areca)}
        ${rowHTML("Coconut", r.Coconut)}
      </table>
    `;

            // Highlight low-input months automatically
            if(
                r.Banana?.includes("Observation") &&
                r.Areca?.includes("Observation") &&
                r.Coconut?.includes("Observation")
            ){
                const note = document.createElement("div");
                note.className = "note";
                note.textContent =
                    "Low-input month – observation, review, and planning only.";
                monthDiv.appendChild(note);
            }

            container.appendChild(monthDiv);
        });
    }

    function rowHTML(crop,text){
        if(!text) return "";

        const cls = crop.toLowerCase();
        return `
    <tr>
      <td><span class="tag ${cls}">${crop}</span></td>
      <td>${formatText(text)}</td>
    </tr>
  `;
    }

    function formatText(text){
        // Preserve Excel line breaks
        return String(text).replace(/\n/g,"<br>");
    }
</script>

</body>
</html>
